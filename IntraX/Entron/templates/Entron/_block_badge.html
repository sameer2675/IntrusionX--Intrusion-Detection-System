{% if b.status == "Blocked" and b.unblock_requested %}<span class="badge badge-unblocking">Unblocking</span>{% elif b.status == "Blocked" %}<span class="badge badge-blocked">Blocked</span>{% elif b.status == "Pending" %}<span class="badge badge-pending">Block pending</span>{% elif b.status == "Failed" %}<span class="badge badge-failed" title="{{ b.message }}">Block failed</span>{% elif b.status == "Expired" %}<span class="badge badge-expired">Block expired</span>{% else %}<span class="badge badge-resolved">Unblocked</span>{% endif %}
